spring.application.name=resgatai
# H2 em memoria; LOCK_TIMEOUT alto para que a 2a reserva concorrente espere o lock (UC04) em vez de falhar.
spring.datasource.url=jdbc:h2:mem:resgatai;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.jpa.open-in-view=false
# Console do banco em http://localhost:8080/h2-console (JDBC URL acima, usuario sa, sem senha)
spring.h2.console.enabled=true
# Usuarios e lotes de demonstracao para o front-end (desligado nos testes)
resgatai.dados-iniciais=true
